name: academy-dev

services:
  php:
    build:
      context: .
      dockerfile: dev/php/Dockerfile
      args:
        UID: "${LOCAL_UID:-1000}"
        GID: "${LOCAL_GID:-1000}"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /home/app
    volumes:
      - ./api:/var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${DEV_API_PORT:-8080}:80"
    volumes:
      - ./api:/var/www/html
      - ./dev/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-academy}
      MYSQL_USER: ${DB_USERNAME:-academy}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
    volumes:
      - mysql_data_academy:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USERNAME:-academy}
      PMA_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${DEV_PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      - db

volumes:
  mysql_data_academy:
