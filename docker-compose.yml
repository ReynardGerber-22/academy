name: academy-dev

services:
  php:
    build:
      context: .
      dockerfile: dev/php/Dockerfile
      args:
        UID: "${LOCAL_UID:-1000}"
        GID: "${LOCAL_GID:-1000}"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /home/app
    volumes:
      - ./api:/var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${DEV_API_PORT:-8080}:80"
    volumes:
      - ./api:/var/www/html
      - ./dev/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: academy
      MYSQL_USER: academy
      MYSQL_PASSWORD: Testing99!
      MYSQL_ROOT_PASSWORD: Testing99!
    volumes:
      - mysql_data_academy:/var/lib/mysql

volumes:
  mysql_data_academy:
