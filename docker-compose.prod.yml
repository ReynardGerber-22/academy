name: academy-prod

services:
  php:
    build:
      context: ./api
      dockerfile: ../dev/php/Dockerfile.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set APP_URL}
      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      APP_KEY: ${APP_KEY:?Set APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: academy
      DB_USERNAME: academy
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  api-nginx:
    build:
      context: ./api
      dockerfile: ../dev/nginx/Dockerfile.prod
    volumes:
      - ./dev/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - laravel_storage:/var/www/html/storage:ro
    depends_on:
      - php
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/up" ]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: academy
      MYSQL_USER: academy
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - mysql_data_academy:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -u root --silent']
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ./frontend
      dockerfile: ../dev/frontend/Dockerfile.prod
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    volumes:
      - ./dev/frontend/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-nginx:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mysql_data_academy:
  laravel_storage:
